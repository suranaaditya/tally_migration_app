[project]
name = "rgi_migration"
authors = [
    { name = "Aditya Surana", email = "aditya.surana@thesvsgroup.org" }
]
description = "RGI Tally to ERPNext opening balance migration (Frappe v16 custom app)."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "lxml>=5.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    # frappe itself is installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.pytest.ini_options]
testpaths = ["rgi_migration/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
    "UP030", "UP031", "UP032", "UP037", "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
